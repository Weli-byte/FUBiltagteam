# patch_v0 sample pack (mini sprint 1.3): small, fast, honest.
pack:
  patches_per_slide: 200   # 30-50 slides x 200 = 6 000-10 000 patches
  seed: 42
  tumor_fraction_min: 0.5  # CAMELYON patch is 'tumor' when >= 50 % of it is inside the annotation
  normal_fraction_max: 0.0 # 'normal' only when no annotated tumor pixel is inside
  overlay: true
  overlay_max_boxes: 300
grid:
  patch_px: 256
  target_mpp: 0.5
  stride_px: null
  min_tissue_fraction: 0.5
  thumbnail_px: 2048
tissue_mask:               # v0 = simple Otsu (morphology off); set morphology: true for v1
  median_blur_px: 7
  saturation_floor: 15
  morphology: false
  open_px: 5
  close_px: 9
  min_object_px: 0
  fill_holes: false
  max_hole_px: 0
run:
  slide_list: data/manifests/patch_v0_slides.csv
  # columns: slide_id,path,source,split,slide_label,annotation_xml,mpp_override
  out_dir: data/processed/patch_v0
