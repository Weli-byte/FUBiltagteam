[project]
name = "onkos"
version = "0.1.0"
description = "ONKOS: multimodal digital oncology research prototype (not for clinical use)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "openapi-spec-validator>=0.7",
    "types-requests",
]

train = [
    "torch>=2.3",
    "numpy>=1.26",
    "mlflow>=2.14",
    "h5py>=3.10",
]
omics = [
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "anndata>=0.10",
    "umap-learn>=0.5",
]
data = [
    "dvc>=3.50",
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=15.0",
]
histo = [
    "h5py>=3.10",
    "matplotlib>=3.8",
    "mlflow>=2.14",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "openslide-bin>=4.0",
    "openslide-python>=1.4",
    "pandas>=2.1",
    "pillow>=10.0",
    "pyarrow>=15.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "tifffile>=2024.8",
    "timm>=1.0",
    "torch>=2.3",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onkos", "models", "services"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["onkos", "models", "services", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["torch.*", "mlflow.*", "numpy.*", "h5py.*", "openapi_spec_validator.*", "pandas.*", "pyarrow.*", "sklearn.*", "matplotlib.*", "anndata.*", "umap.*", "scipy.*", "joblib.*", "cv2.*", "openslide.*", "timm.*", "tifffile.*", "torchvision.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy/pandas/sklearn/cv2 return loosely typed values; strict return checks add noise here.
module = ["models.omics.*", "models.histo.*"]
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
