[project]
name = "onkos"
version = "0.1.0"
description = "ONKOS: multimodal digital oncology research prototype (not for clinical use)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "openapi-spec-validator>=0.7",
    "types-requests",
]

train = [
    "torch>=2.3",
    "numpy>=1.26",
    "mlflow>=2.14",
    "h5py>=3.10",
]
data = [
    "dvc>=3.50",
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onkos", "models", "services"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["onkos", "models", "services", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["torch.*", "mlflow.*", "numpy.*", "h5py.*", "openapi_spec_validator.*", "pandas.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
